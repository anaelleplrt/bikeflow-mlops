
name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check code
        run: python -m ruff check app tests

      - name: Build Docker image
        run: docker build -t bikeflow:ci .

      - name: Create test model
        run: python tests/create_ci_model.py

      - name: Run Docker smoke test
        run: |
          docker run -d \
            --name bikeflow-ci \
            -e MODEL_SOURCE=ci \
            -e CI_MODEL_PATH=/tmp/ci_model.joblib \
            -v "$PWD/ci_model.joblib:/tmp/ci_model.joblib:ro" \
            -p 8000:8000 \
            bikeflow:ci

          python tests/smoke_ci.py

      - name: Show Docker logs on failure
        if: failure()
        run: docker logs bikeflow-ci || true

      - name: Clean up container
        if: always()
        run: docker rm -f bikeflow-ci || true
